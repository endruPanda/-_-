/* лёгкое затемнение фото для читаемости надписей поверх */
.bg-scrim{
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(120% 70% at 50% 100%, rgba(0,0,0,0.35), transparent 55%),
    linear-gradient(180deg, rgba(0,0,0,0.18), transparent 30%);
  pointer-events:none;
}

/* ===== 2. Вертикальная стеклянная панель ===== */
.panel{
  position:relative;
  z-index:1;
  width:100%;
  max-width:380px;
  min-height:600px;
  max-height:92vh;
  border-radius:20px;
  background:linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05));
  backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:0 25px 60px -20px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.25);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:48px 28px 32px;
  text-align:center;
  overflow:hidden;
}
.panel::before{
  content:'';
  position:absolute;
  top:-60%;left:-25%;
  width:65%;height:220%;
  background:linear-gradient(100deg, rgba(255,255,255,0.16), rgba(255,255,255,0));
  transform:rotate(12deg);
  pointer-events:none;
}

/* ===== 3a. Аватарка ===== */
.center{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-top:auto;
  margin-bottom:auto;
}

.avatar-wrap{
  position:relative;
  width:245px;height:245px;
  margin-bottom:26px;
  display:flex;align-items:center;justify-content:center;
}
.ring{
  position:absolute;inset:0;border-radius:50%;
  border:1px solid rgba(255,255,255,0.5);
  opacity:0;
}
.avatar-wrap.is-live .ring{animation:pulse 2.4s ease-out infinite;}
.avatar-wrap.is-live .ring:nth-child(2){animation-delay:.8s;}
@keyframes pulse{0%{transform:scale(.74);opacity:.6;}100%{transform:scale(1.5);opacity:0;}}
.avatar-wrap.is-connecting .avatar-photo{animation:breathe 1.7s ease-in-out infinite;}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.3);}50%{box-shadow:0 0 0 14px rgba(255,255,255,0);}}

.avatar-photo{
  position:relative;

/* ===== 3b. Имя ===== */
h1{
  margin:0;
  font-size:28px;
  font-weight:700;
  letter-spacing:-0.01em;
  line-height:1.3;
  text-shadow:0 2px 20px rgba(0,0,0,0.4);
}

.subtitle{
  margin:10px 0 0;
  font-size:14.5px;
  font-weight:500;
  color:var(--ink-dim);
  min-height:18px;
  text-shadow:0 1px 10px rgba(0,0,0,0.35);
}
.subtitle .timer{font-variant-numeric:tabular-nums;color:var(--ink);}

.kicker{
  display:inline-flex;align-items:center;gap:7px;
  margin-top:16px;
  padding:6px 14px;border-radius:999px;
  background:rgba(255,255,255,0.14);
  border:1px solid rgba(255,255,255,0.3);
  font-size:12px;font-weight:500;color:var(--ink-dim);
  opacity:0;transition:opacity .2s ease;
}
.kicker.show{opacity:1;}
.kicker .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-dim);flex:none;}
.kicker.state-connecting .dot{background:#FFD166;animation:blink 1s ease-in-out infinite;}
.kicker.state-live .dot{background:var(--live);box-shadow:0 0 0 3px rgba(52,211,153,.3);}
.kicker.state-error .dot{background:#FF453A;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ===== 3c. Кнопка "Позвонить" ===== */
.btn-start{
  width:100%;
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:17px;
  border:none;border-radius:16px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.6);
  color:#12181F;
  font-family:inherit;font-size:16px;font-weight:600;
  cursor:pointer;
  box-shadow:0 16px 34px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.6);
  transition:transform .12s ease, background .15s ease;
}
.btn-start:hover{background:rgba(255,255,255,0.95);}
.btn-start:active{transform:scale(.97);}
.btn-start:disabled{opacity:.55;}
.btn-start svg{width:18px;height:18px;flex:none;}
.btn-start svg path{fill:#12181F;}

.btn-end{
  display:none;
  width:100%;
  align-items:center;justify-content:center;gap:10px;
  padding:17px;
  border:none;border-radius:16px;
  background:rgba(255,69,58,0.4);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,0.35);
  color:#fff;
  font-family:inherit;font-size:16px;font-weight:600;
  cursor:pointer;
  box-shadow:0 14px 30px -12px var(--danger-glow), inset 0 1px 0 rgba(255,255,255,0.3);
  transition:transform .12s ease, background .15s ease;
}
.btn-end:hover{background:rgba(255,69,58,0.5);}
.btn-end:active{transform:scale(.97);}
.btn-end svg{width:18px;height:18px;flex:none;}

.hidden{display:none !important;}
</style>

<body>

<div class="bg-scrim"></div>

<div class="panel">
  <div class="center">
    <div id="avatar-wrap" class="avatar-wrap">
      <span class="ring"></span>
      <span class="ring"></span>
      <div class="avatar-photo"></div>
    </div>
    <h1>Таня</h1>
    <p class="subtitle" id="status-text"></p>
    <div id="kicker" class="kicker state-idle">
      <span class="dot"></span>
      <span id="kicker-text">Не в сети</span>
    </div>
  </div>

  <button id="start-btn" class="btn-start">
    <svg viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.5 21 3 13.5 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z" fill="#fff"/></svg>
    Позвонить
  </button>
  <button id="stop-btn" class="btn-end">
    <svg viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.5 21 3 13.5 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z" fill="#fff" transform="rotate(135 12 12)"/></svg>
    Завершить
  </button>
</div>

<script type="module">
import vapiModule from 'https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/+esm';
const Vapi = vapiModule.default || vapiModule;

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const VAPI_PUBLIC_KEY = "3339210c-8d4a-470b-a801-029fa3da72bf";
const VAPI_ASSISTANT_ID = "d711f766-0280-4ca1-a42b-ef2c390bbef5";

const N8N_CONTEXT_URL = "https://vecher.app.n8n.cloud/webhook/vapi-get-context";

const vapi = new Vapi(VAPI_PUBLIC_KEY);

// Запрашиваем контекст (память) у n8n перед звонком.
// Если вебхук недоступен или не ответил за 10 секунд — звонок всё равно начнётся, просто без памяти.
async function fetchMemory(payload){
  const ctrl = new AbortController();
  const timeoutId = setTimeout(() => ctrl.abort(), 10000);
  try {
    const res = await fetch(N8N_CONTEXT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: ctrl.signal
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    try {
      const data = JSON.parse(text);
      return typeof data === 'string' ? data : JSON.stringify(data);
    } catch (_) {
      return text;
    }
  } catch (e) {
    console.error('Не удалось получить контекст из n8n:', e);
    return '';
  } finally {
    clearTimeout(timeoutId);
  }
}

/* ================== Звуки (Web Audio API, без файлов — 0 КБ веса) ================== */
let audioCtx = null;
let ringInterval = null;

function ensureAudio(){
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone({freq = 440, duration = 0.12, type = 'sine', volume = 0.18, delay = 0, freqTo = null}) {
  const ctx = ensureAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const t0 = ctx.currentTime + delay;
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (freqTo !== null) osc.frequency.linearRampToValueAtTime(freqTo, t0 + duration);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(volume, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}

function playClickStart(){
  tone({ freq: 620, freqTo: 780, duration: 0.09, type: 'sine', volume: 0.16 });
}
function playClickEnd(){
  tone({ freq: 420, freqTo: 300, duration: 0.09, type: 'sine', volume: 0.16 });
}
function playRingBeep(){
  tone({ freq: 480, duration: 0.16, type: 'sine', volume: 0.14 });
  tone({ freq: 440, duration: 0.16, type: 'sine', volume: 0.14, delay: 0.18 });
}
function startRingtone(){
  stopRingtone();
  playRingBeep();
  ringInterval = setInterval(playRingBeep, 1100);
}
function stopRingtone(){
  if (ringInterval) { clearInterval(ringInterval); ringInterval = null; }
}
function playConnectedChime(){
  tone({ freq: 523, duration: 0.14, type: 'sine', volume: 0.16 });
  tone({ freq: 659, duration: 0.18, type: 'sine', volume: 0.16, delay: 0.12 });
}
function playHangupTone(){
  tone({ freq: 400, freqTo: 180, duration: 0.28, type: 'sine', volume: 0.16 });
}
function playErrorBuzz(){
  tone({ freq: 160, duration: 0.22, type: 'sawtooth', volume: 0.12 });
}
/* ===================================================================================== */

const startBtn = document.getElementById('start-btn');
const stopBtn = document.getElementById('stop-btn');
const kicker = document.getElementById('kicker');
const kickerText = document.getElementById('kicker-text');
const statusText = document.getElementById('status-text');
const avatarWrap = document.getElementById('avatar-wrap');

let timerInterval = null;
let callSeconds = 0;

function setKicker(state, text){
  kicker.className = 'kicker show state-' + state;
  kickerText.textContent = text;
}

function formatTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return m+':'+sec;
}

function startTimer(){
  callSeconds = 0;
  timerInterval = setInterval(() => {
    callSeconds++;
    statusText.innerHTML = '<span class="timer">' + formatTime(callSeconds) + '</span>';
  }, 1000);
}
function stopTimer(){ clearInterval(timerInterval); timerInterval = null; }

startBtn.addEventListener('click', async () => {
  playClickStart();
  startBtn.disabled = true;
  setKicker('connecting', 'Подключение...');
  avatarWrap.classList.add('is-connecting');
  startRingtone();
  startBtn.classList.add('hidden');
  stopBtn.style.display = 'flex';

  // Передаём Telegram-идентификатор пользователя в Vapi,
  // чтобы связать звонок с той же записью в общей БД,
  // что использует текстовый бот (по chat.id / user.id).
  const tgUser = tg?.initDataUnsafe?.user;
  const callMetadata = {
    telegram_user_id: tgUser?.id ? String(tgUser.id) : null,
    telegram_username: tgUser?.username || null,
    telegram_name: [tgUser?.first_name, tgUser?.last_name].filter(Boolean).join(' ') || null
  };

  try {
    const memory = await fetchMemory(callMetadata);
    await vapi.start(VAPI_ASSISTANT_ID, {
      metadata: callMetadata,
      variableValues: { memory }
    });
  } catch (err) {
    console.error('Ошибка старта:', err);
    stopRingtone();
    playErrorBuzz();
    setKicker('error', 'Ошибка подключения');
    avatarWrap.classList.remove('is-connecting');
    startBtn.classList.remove('hidden');
    startBtn.disabled = false;
    stopBtn.style.display = 'none';
  }
});

stopBtn.addEventListener('click', () => {
  playClickEnd();
  setKicker('connecting', 'Завершение...');
  vapi.stop();
});

vapi.on('call-start', () => {
  stopRingtone();
  playConnectedChime();
  avatarWrap.classList.remove('is-connecting');
  avatarWrap.classList.add('is-live');
  setKicker('live', 'В сети');
  statusText.textContent = '';
  startTimer();
  startBtn.classList.add('hidden');
  startBtn.disabled = false;
  stopBtn.style.display = 'flex';
});

vapi.on('call-end', () => {
  stopRingtone();
  playHangupTone();
  avatarWrap.classList.remove('is-live','is-connecting');
  stopTimer();
  setKicker('idle', 'Не в сети');
  statusText.textContent = '';
  startBtn.classList.remove('hidden');
  stopBtn.style.display = 'none';
});

vapi.on('error', (e) => {
  console.error('Vapi Error:', e);
  stopRingtone();
  playErrorBuzz();
  avatarWrap.classList.remove('is-live','is-connecting');
  stopTimer();
  setKicker('error', 'Ошибка соединения');
  startBtn.classList.remove('hidden');
  startBtn.disabled = false;
  stopBtn.style.display = 'none';
});
</script>

</body>
</html>
